name: Beta browser engines
on: workflow_dispatch
jobs:
  browser-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: BETA_ALL_ENGINES=1 npm run test:beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-browser-evidence
          path: |
            artifacts/
            test-results/beta-browser/
          if-no-files-found: ignore
